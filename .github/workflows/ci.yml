name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install (exact lockfile, no install scripts)
        run: npm ci --ignore-scripts
      - name: Typecheck every workspace
        run: npm run typecheck
      - name: Tests (no network)
        run: npm test
      - name: Build the web app
        run: npm run -w @zerofee/web build
