[package]
name = "account-policy-proofs-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }
near-sdk = { version = "=5.29.1", features = ["unit-testing"] }
account-policy-proofs = { path = "..", features = ["fuzzing"] }

[[bin]]
name = "contract"
path = "fuzz_targets/contract.rs"
test = false
doc = false
bench = false

[[bin]]
name = "recovery_seq"
path = "fuzz_targets/recovery_seq.rs"
test = false
doc = false
bench = false

[[bin]]
name = "recovery_seq_wide"
path = "fuzz_targets/recovery_seq_wide.rs"
test = false
doc = false
bench = false
