[package]
name = "recovery-policy"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5"
# The raw runtime calls, for adding an ML-DSA-65 key (near-sdk's PublicKey type predates it).
near-sys = "=0.2.14"

[dev-dependencies]
near-sdk = { version = "5", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
